<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chamados">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Portal de Chamados | SuperVille</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="fontes/montserrat-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/montserrat-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Montserrat hospedada no próprio portal (pasta fontes/) — não depende do Google Fonts */
@font-face{font-family:"Montserrat";src:url("fontes/montserrat-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Montserrat";src:url("fontes/montserrat-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Montserrat";src:url("fontes/montserrat-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Montserrat";src:url("fontes/montserrat-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Montserrat";src:url("fontes/montserrat-800.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
:root{--preto:#111111;--verde:#3BB072;--verde-esc:#2D8F5A;--verde-claro:#E8F6EE;--bg:#F3F4F6;--card:#FFFFFF;--txt:#1F2328;--muted:#6B7280;--borda:#E5E7EB;--vermelho:#D93025;--laranja:#D97706;--azul:#2563EB;--raio:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Montserrat",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;-webkit-font-smoothing:antialiased}
*,*::before,*::after,button,input,select,textarea,table,::placeholder{font-family:"Montserrat",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde-esc);font-weight:700}

/* Abertura */
#splash{position:fixed;inset:0;background:var(--preto);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;transition:opacity .4s}
#splash.sai{opacity:0;pointer-events:none}
#splash .logo{width:min(150px,42vw);height:auto}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--verde);border-radius:50%;animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.splash-txt{color:#fff;font-weight:700;letter-spacing:.3px;font-size:20px;line-height:1.2}

/* Topo */
#topo{position:sticky;top:0;z-index:20}
header{background:var(--preto);color:#fff;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:14px}
header .logo{height:46px;width:auto;display:block;flex:none}
header .logo + .h-tit{border-left:1px solid rgba(255,255,255,.22);padding-left:14px}
.h-tit{flex:1;min-width:0}
.h-tit b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.h-tit small{display:block;font-size:12px;line-height:1.3;margin-top:2px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-user{text-align:right;font-size:12px;opacity:.9}
.h-user b{display:block;font-size:13px}
@media(max-width:560px){.h-user{display:none}}
.h-tit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){header{gap:10px}header .logo{height:40px}header .logo + .h-tit{padding-left:10px}.h-tit b{font-size:15px}.h-tit small{font-size:11px}.btn-sair{padding:6px 9px}}
@media(max-width:370px){header .logo{height:36px}.h-tit b{font-size:14px}}
@media(max-width:340px){header .logo{height:34px}.h-tit b{font-size:13px}.btn-sair{padding:5px 7px;font-size:11px}header .logo + .h-tit{padding-left:8px}header{gap:8px}}
.btn-sair{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
nav.abas{background:#fff;border-bottom:1px solid var(--borda);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
.aba{background:none;border:0;padding:14px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.aba.on{color:var(--txt);border-bottom-color:var(--verde)}
.badge{background:var(--verde);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px;font-weight:700}

main{max-width:1000px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.card{background:var(--card);border-radius:var(--raio);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--borda);margin-bottom:14px}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px;margin:0 0 14px}

/* Novo chamado */
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tipo-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#fff;border:2px solid var(--borda);border-radius:var(--raio);padding:16px;cursor:pointer;transition:.15s}
.tipo-card:hover{border-color:var(--c);transform:translateY(-1px)}
.tipo-ico{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:flex;align-items:center;justify-content:center}
.tipo-card small{color:var(--muted)}
.tipo-card em{font-style:normal;font-size:12px;font-weight:700;color:var(--c)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;margin-bottom:12px}
input,select,textarea{border:1px solid #D1D5DB;border-radius:8px;padding:10px 11px;background:#fff;font-weight:500;font-size:16px;width:100%;-webkit-appearance:none;appearance:none}
select{background:#fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%23555%27 stroke-width=%271.6%27/%3E%3C/svg%3E") no-repeat right 12px center;padding-right:32px}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde);outline-offset:-1px;border-color:var(--verde)}
label.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
label.check input{width:18px;height:18px;accent-color:var(--verde);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
#itens{counter-reset:item}
.item{border:1px dashed #CBD5E1;border-radius:10px;padding:12px 12px 2px;margin-bottom:12px;background:#FAFAFA}
.item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-top b::before{counter-increment:item;content:"Produto " counter(item)}
.btn{background:var(--verde);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--verde-esc)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.perigo{background:var(--vermelho)}
.btn-sec{background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn-sec:hover{border-color:var(--verde)}
.btn-link{background:none;border:0;color:var(--verde-esc);font-weight:700;cursor:pointer;padding:0;margin-bottom:8px}
.btn-full{width:100%}
.form-acts{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.farol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.farol button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit}
.farol button.on{outline:2px solid var(--c)}
.farol i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,#fff)}
.farol b{display:block;font-size:20px;font-weight:800;line-height:1}
.farol span{font-size:11.5px;font-weight:700;color:var(--muted)}
@media(max-width:400px){.farol button{flex-direction:column;align-items:flex-start;gap:6px;padding:9px}.farol span{font-size:10.5px}}
.barra-fixa{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));margin:0 -18px -18px;padding:16px 18px calc(14px + env(safe-area-inset-bottom))}
.acoes-fixas{margin:0 -18px;padding:12px 18px calc(10px + env(safe-area-inset-bottom))}
.modal .barra-fixa{background:linear-gradient(to top,#fff 80%,rgba(255,255,255,0))}
.x{background:none;border:0;color:var(--vermelho);font-size:12px;font-weight:700;cursor:pointer}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.foto{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--borda);cursor:pointer;padding:0;background:none}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1}

/* Listas */
.banner{background:var(--verde-claro);border:1px solid #BFE5CF;color:#14532D;border-radius:var(--raio);padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner.neutro{background:#fff;border-color:var(--borda);color:var(--txt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--borda);border-left:4px solid var(--c);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.kpi.static{cursor:default}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.on{outline:2px solid var(--c)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid #D1D5DB;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--preto);color:#fff;border-color:var(--preto)}
.filtros select,.filtros input[type=search]{width:auto;flex:1;min-width:150px;padding:8px 10px;font-size:16px}
.filtros select{padding-right:32px}
.filtros label.check{margin:0}
.lista{display:flex;flex-direction:column;gap:10px}
.chamado{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--borda);border-left:6px solid var(--f,var(--c));border-radius:10px;padding:12px 14px;cursor:pointer}
.chamado:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chamado-l1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.num{font-weight:800}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);text-transform:uppercase;letter-spacing:.3px}
.tag.urg{--c:var(--vermelho)}
.tag.atr{--c:var(--laranja)}
.status{margin-left:auto;font-size:12px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chamado-res{font-weight:600;margin-bottom:4px}
.chamado-meta{font-size:12px;color:var(--muted)}
.vazio{text-align:center;color:var(--muted);padding:36px 12px;background:#fff;border:1px dashed var(--borda);border-radius:var(--raio)}

/* Detalhe */
.modal,.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:50}
.modal[hidden],.dlg[hidden]{display:none}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:720px;overflow:clip}
.md-head{background:var(--preto);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--c)}
.md-head .x-close{margin-left:auto;background:none;border:0;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.md-body{padding:16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.info div{background:#F9FAFB;border-radius:8px;padding:8px 10px}
.info dt{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.info dd{margin:2px 0 0;font-weight:600;font-size:14px;word-break:break-word}
.tab-wrap{overflow-x:auto;margin-bottom:14px;border:1px solid var(--borda);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--preto);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--borda);vertical-align:top}
tbody tr:nth-child(even) td{background:#F4FAF6}
.preco-por{color:var(--vermelho);font-weight:700}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.dica{font-size:13px;color:var(--muted);margin:6px 0 0}
.sec-tit{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;letter-spacing:.4px}
.timeline{list-style:none;margin:14px 0 0;padding:0}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--verde)}
.timeline li::after{content:"";position:absolute;left:7.5px;top:15px;bottom:0;width:1px;background:var(--borda)}
.timeline li:last-child::after{display:none}
.timeline small{color:var(--muted)}
.timeline .obs{display:block;background:#F3F4F6;border-radius:8px;padding:6px 9px;margin-top:4px;white-space:pre-wrap}
.msg-box{display:flex;gap:8px;align-items:flex-end}
.msg-box textarea{flex:1}

/* Diálogos e avisos */
.dlg{align-items:center;z-index:60}
.dlg-box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg-box p{color:var(--muted);font-size:14px;margin:0 0 12px}
.dlg-err{color:var(--vermelho);font-size:12px;min-height:16px;margin:4px 0}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px}
.dlg-foto{max-width:900px;background:none;padding:0;text-align:right}
.dlg-foto img{max-width:100%;max-height:80vh;border-radius:10px;display:block;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140px);background:var(--preto);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;transition:transform .25s;max-width:calc(100% - 32px)}
#toast.show{transform:translate(-50%,0)}
#toast.ok{background:var(--verde-esc)}
#toast.erro{background:var(--vermelho)}

/* Login */
.login{max-width:400px;margin:32px auto}
.login-head{background:var(--preto);border-radius:14px 14px 0 0;padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;border-bottom:4px solid var(--verde);text-align:center}
.login-head .logo{width:130px;height:auto;margin-bottom:4px}
.login-head b{font-size:20px;font-weight:700;line-height:1.2}
.login-head small{font-size:13px;opacity:.7}
.login-body{background:#fff;border-radius:0 0 14px 14px;padding:20px;border:1px solid var(--borda);border-top:0}
.demo-users{display:grid;gap:8px}

/* Painel */
.bar{height:8px;background:#EEF0F2;border-radius:99px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;border-radius:99px}
.legenda{font-size:13px;color:var(--muted);line-height:1.6}
.legenda b{color:var(--txt)}
.legenda p{margin:0 0 8px}

.grid3{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:0 12px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:last-child{grid-column:1/-1}}
.cod-in{display:flex;gap:6px}
.btn-scan{flex:none;width:46px;border:1px solid #D1D5DB;background:#fff;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt)}
.cod-info{font-size:13px;margin:-6px 0 12px;min-height:4px}
.ci-ok{color:var(--verde-esc);font-weight:700}
.ci-warn{color:#B45309;font-weight:600}
.ci-muted{color:var(--muted)}
.dif{font-size:13px;margin:-6px 0 12px;min-height:4px}
.dif-neg{color:var(--vermelho);font-weight:600}
.dif-pos{color:var(--verde-esc);font-weight:600}
.placa-extra{background:#fff;border:1px solid #BFE5CF;border-radius:8px;padding:10px 10px 0;margin:-4px 0 12px}
.balancas{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;margin-bottom:14px}
.bal{flex-direction:row;align-items:center;justify-content:center;gap:6px;margin:0;border:1px solid #D1D5DB;border-radius:10px;padding:10px 6px;font-weight:700;font-size:15px;cursor:pointer;background:#fff}
.bal.todas{grid-column:1/-1}
.bal input{width:18px;height:18px;accent-color:var(--verde);flex:none;-webkit-appearance:auto;appearance:auto}
.bal:has(input:checked){border-color:var(--verde);background:var(--verde-claro)}
.bal.todas{border-style:dashed}
.banner.quem{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.banner.quem .btn-link{margin:0}
.escolhas{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.escolha{text-align:left;background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px}
.escolha b{margin-right:6px}
input:disabled{background:#F3F4F6;color:#8A1C12;font-weight:700}
.urg-aviso{background:#FDECEA;border-color:#F5C2BD;color:#8A1C12}
.alerta-urg{display:block;width:100%;text-align:left;background:var(--vermelho);color:#fff;border:0;border-radius:var(--raio);padding:14px 16px;margin-bottom:14px;cursor:pointer;animation:pulsa 1.4s ease-in-out infinite}
.alerta-urg b{display:block;font-size:16px;margin-bottom:4px}
.alerta-urg span{font-size:13px;opacity:.95}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}50%{box-shadow:0 0 0 8px rgba(217,48,37,0)}}
.print-only{display:none}
@media print{
  #topo,.no-print,.modal,.dlg,#toast,#splash{display:none!important}
  .print-only{display:block}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  th,tbody tr:nth-child(even) td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-tit{font-weight:800;font-size:18px;margin-bottom:12px}
}
</style>
</head>

const T0 = Date.now();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };

const pad = n => String(n).padStart(2, "0");
const fmtData = ms => { if (!ms) return "—"; const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDia = s => { if (!s) return "—"; const [y, m, d] = String(s).split("-"); return d ? `${d}/${m}` : s; };
const fmtDur = ms => {
  if (ms == null || isNaN(ms)) return "—";

const desde = ms => "há " + fmtDur(Date.now() - ms);
const numero = v => { let s = String(v ?? "").trim(); if (!s) return NaN; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return parseFloat(s); };
const brl = v => { const n = numero(v); return isNaN(n) ? "—" : n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); };
const num4 = n => "#" + String(n || 0).padStart(4, "0");
const slaTxt = t => t.imediato ? `imediato (${PRAZO_URGENTE_MIN} min)` : `${t.sla || PRAZO_NORMAL_H}h, até as ${LOJA_FECHA_H}h`;
// Início da contagem: dentro do horário da loja (antes das 7h conta das 7h; depois das 21h conta das 7h do dia seguinte)
const inicioPrazo = ms => { const d = new Date(ms), h = d.getHours();

// Pessoa que usa este celular (a conta é da loja; nome e cargo ficam guardados no aparelho)
const Pessoa = {
  _mem: null,
  ler() {
    if (this._mem) return this._mem;
    try { const s = localStorage.getItem("cs_pessoa"); if (s) this._mem = JSON.parse(s); } catch (e) {}
    return this._mem;
  },
  salvar(nome, cargo, novoAparelho = false) {
    const atual = novoAparelho ? null : this.ler();
    const p = { id: atual?.id || "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), nome: nome.trim().replace(/\s+/g, " "), cargo };
    this._mem = p; try { localStorage.setItem("cs_pessoa", JSON.stringify(p)); } catch (e) {}

const podeSerGerente = nome => { const l = gerentesDaLoja(); return !l || l.some(g => normNome(nome).split(" ")[0] === normNome(g)); };
const msgGerente = () => { const l = gerentesDaLoja() || []; return `O cargo Gerente é só para ${l.slice(0, -1).join(", ")}${l.length > 1 ? " ou " : ""}${l.slice(-1)}. Escolha Encarregado ou Apoio.`; };
const ehMeu = p => { const eu = Pessoa.ler(); return !!eu && p.loja === Store.perfil?.loja && (p.dispositivoId === eu.id || normNome(p.solicitanteNome) === normNome(eu.nome)); };
const ehGerenteAqui = () => { const eu = ehLoja() && Pessoa.ler(); return !!eu && eu.cargo === "Gerente" && podeSerGerente(eu.nome); };
// Na conta da loja: cada pessoa vê o que abriu; o gerente também vê os resolvidos da loja
const visivelLoja = p => ehMeu(p) || (ehGerenteAqui() && p.status === "concluido");
const quemSou = () => ehLoja() ? (Pessoa.ler()?.nome || Store.perfil?.nome) : Store.perfil?.nome;
const ehResponsavel = p => !!p.responsavelUid && p.responsavelUid === Store.perfil?.uid;
// Quem pode mexer no chamado (mensagens e ações)

function comprimir(file, max = 1000, q = 0.6) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height; const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const DEMO_CSV = `codigo;ean;descricao;secao
10234-1;789100010010-3;ARROZ TIPO 1 5KG;MERCEARIA
20511-6;789600671111-8;FEIJAO CARIOCA 1KG;MERCEARIA
30877-2;789490001151-7;REFRIGERANTE COLA 2L;BEBIDAS
50033-5;789100005350-8;CAFE TORRADO E MOIDO 500G;MERCEARIA
80450-3;789605113001-7;ACEM BOVINO KG;ACOUGUE
29254-2;;PERFLEX;REMESSA MATERIAL PROMOCIONAL
2925-4;789000000292-5;PRODUTO EXEMPLO AMBIGUO;MERCEARIA`;
const Produtos = {
  mapa: new Map(), carregado: false, total: 0, exemplo: false,
  norm: c => String(c || "").replace(/\D/g, "").replace(/^0+/, ""),
  async carregar() {
    try { const r = await fetch(BASE_PRODUTOS, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); this.indexar(await r.text()); }
    catch (e) { if (Store.modo === "demo") { this.indexar(DEMO_CSV); this.exemplo = true; } }
  },
  _add(k, p) { const n = this.norm(k); if (!n) return; const l = this.mapa.get(n); if (!l) this.mapa.set(n, [p]); else if (!l.includes(p)) l.push(p); },
  indexar(txt) {
    const linhas = txt.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
    if (linhas.length < 2) return;
    const sep = linhas[0].split(";").length >= linhas[0].split(",").length ? ";" : ",";
    const limpa = s => String(s ?? "").trim().replace(/^"|"$/g, "").trim();
    const cab = linhas[0].split(sep).map(s => limpa(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""));
    const iEan = cab.findIndex(c => /ean|barra|gtin/.test(c));
    const iCod = cab.findIndex((c, i) => i !== iEan && /cod|plu|interno|sku/.test(c));
    const iDesc = cab.findIndex(c => /desc|produto|nome/.test(c));
    const iSec = cab.findIndex(c => /secao|setor|depto/.test(c));
    if (iDesc < 0 || (iEan < 0 && iCod < 0)) { console.warn("produtos.csv: cabeçalho não reconhecido", cab); return; }
    this.mapa.clear(); this.total = 0;
    for (const l of linhas.slice(1)) {
      const c = l.split(sep).map(limpa);
      const p = { codigo: iCod >= 0 ? c[iCod] : "", ean: iEan >= 0 ? c[iEan] : "", descricao: c[iDesc] || "", secao: iSec >= 0 ? c[iSec] : "" };
      if (!p.descricao) continue;
      this._add(p.codigo, p);                                              // PLU com dígito (29254-2 → 292542)
      if (/-\d$/.test(p.codigo)) this._add(p.codigo.replace(/-\d$/, ""), p); // PLU sem dígito (29254)
      this._add(p.ean, p);                                                 // código de barras
      this.total++;
    }
    this.carregado = this.total > 0;
  },
  // Todos os produtos que batem com o que foi digitado. Com hífen, a busca é exata.
  buscarTodos(v) {
    const k = this.norm(v); if (!k) return [];
    const l = this.mapa.get(k) || [];
    return /-/.test(v) ? l.filter(p => this.norm(p.codigo) === k || this.norm(p.ean) === k) : l;
  },
  buscar(v) { const l = this.buscarTodos(v); return l.length === 1 ? l[0] : null; }
};

// Mostra a descrição do produto assim que o código é digitado ou lido
function infoCodigo(input) {
  const wrap = input.closest(".item, .cad-ean"), box = wrap.querySelector(".cod-info"), hid = wrap.querySelector("input[name=descricao][type=hidden]");
  const v = input.value.trim(), cadastro = wrap.classList.contains("cad-ean");
  if (hid) hid.value = "";
  delete input.dataset.ambig;
  if (!v) { box.innerHTML = ""; return; }
  if (!Produtos.carregado) { box.innerHTML = '<span class="ci-muted">Base de produtos indisponível — o escritório confere pelo código.</span>'; return; }
  const l = Produtos.buscarTodos(v);
  if (cadastro) {
    box.innerHTML = l.length ? `<span class="ci-warn">Este código já está cadastrado como <b>${esc(l[0].descricao)}</b> (PLU ${esc(l[0].codigo)}). Confira se é mesmo um produto sem cadastro.</span>`
                             : '<span class="ci-ok">Código não encontrado na base — ok para pedir cadastro.</span>';
    return;
  }
  if (l.length === 1) {
    const p = l[0]; if (hid) hid.value = p.descricao;
    box.innerHTML = `<span class="ci-ok">✓ ${esc(p.descricao)}</span> <span class="ci-muted">· PLU ${esc(p.codigo)}${p.secao ? " · " + esc(p.secao) : ""}</span>`;
  } else if (l.length > 1) {
    input.dataset.ambig = "1";
    box.innerHTML = `<span class="ci-warn">Mais de um produto com esse número. Toque no certo:</span>
      <div class="escolhas">${l.map(p => `<button type="button" class="escolha" data-act="escolherProd" data-cod="${esc(p.codigo)}"><b>${esc(p.codigo)}</b> ${esc(p.descricao)}</button>`).join("")}</div>`;
  } else box.innerHTML = `<span class="ci-warn">Código não encontrado na base. Confira o número${novoTipo === "placa" ? " ou abra um chamado de <b>Produto sem cadastro</b>" : ""}.</span>`;
}

function carregarScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function escanear(input) {
  const d = $("#dlg"); d.onclick = null;
  d.innerHTML = `<div class="dlg-box"><h3>Aponte para o código de barras</h3>
    <div id="scanBox" style="width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:220px"></div>
    <div class="dlg-acts" style="margin-top:10px"><button class="btn-sec" id="scanFechar">Cancelar</button></div></div>`;
  d.hidden = false;
  let ativo = true, parar = () => {};
  const fim = () => { ativo = false; try { parar(); } catch (e) {} d.hidden = true; d.innerHTML = ""; };
  const lido = v => { if (!ativo) return; input.value = v; input.dispatchEvent(new Event("input", { bubbles: true })); fim(); toast("Código lido: " + v, "ok"); };
  $("#scanFechar").onclick = fim;
  try {
    if ("BarcodeDetector" in window) {
      const v = document.createElement("video"); v.setAttribute("playsinline", ""); v.muted = true; v.style.cssText = "width:100%;display:block;max-height:60vh";
      $("#scanBox").appendChild(v);
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      parar = () => stream.getTracks().forEach(t => t.stop());
      if (!ativo) return parar();
      v.srcObject = stream; await v.play();
      const det = new BarcodeDetector();
      const loop = async () => { if (!ativo) return; try { const r = await det.detect(v); if (r.length) return lido(r[0].rawValue); } catch (e) {} setTimeout(loop, 250); };
      loop();
    } else {
      if (!window.__Html5QrcodeLibrary__) await carregarScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js");
      if (!ativo) return;
      const Lib = window.__Html5QrcodeLibrary__, Fm = Lib.Html5QrcodeSupportedFormats;
      const leitor = new Lib.Html5Qrcode("scanBox", { verbose: false, formatsToSupport: [Fm.EAN_13, Fm.EAN_8, Fm.UPC_A, Fm.UPC_E, Fm.CODE_128] });
      parar = () => { leitor.stop().then(() => leitor.clear()).catch(() => {}); };
      await leitor.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 120 } }, txt => lido(txt), () => {});
      if (!ativo) parar();
    }
  } catch (e) { console.error(e); fim(); toast("Não foi possível abrir a câmera. Digite o código.", "erro"); }
}

const Store = {
  modo: "demo", perfil: null, _fb: null, _listeners: new Set(),

  async iniciar() {
    if (!FIREBASE_CONFIG.apiKey || new URLSearchParams(location.search).has("demo")) { this.modo = "demo"; return; }
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    this._fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
    this.modo = "firebase";
  },

  aoMudarSessao(cb) {
    if (this.modo === "demo") { this.perfil = DEMO_USERS.find(u => u.uid === ssGet("cs_demo_uid")) || null; cb(this.perfil); return; }
    const { auth, A, F, db } = this._fb;
    A.onAuthStateChanged(auth, async user => {
      if (!user) { this.perfil = null; cb(null); return; }
      try {
        const s = await F.getDoc(F.doc(db, "usuarios", user.uid));
        if (!s.exists()) { toast("Usuário sem perfil cadastrado. Fale com o escritório.", "erro"); await A.signOut(auth); return; }
        this.perfil = { uid: user.uid, ...s.data() }; cb(this.perfil);
      } catch (e) { console.error(e); toast("Erro ao carregar o perfil.", "erro"); this.perfil = null; cb(null); }
    });
  },

  async entrar(email, senha) { await this._fb.A.signInWithEmailAndPassword(this._fb.auth, email, senha); },
  entrarDemo(uid) { ssSet("cs_demo_uid", uid); this.perfil = DEMO_USERS.find(u => u.uid === uid); },
  async sair() {
    if (this.modo === "demo") { ssDel("cs_demo_uid"); this.perfil = null; return; }
    await this._fb.A.signOut(this._fb.auth);
  },

  observarPedidos(cb) {
    // Escritório e gestor: todos os chamados. Conta da loja: os chamados da loja (o filtro por pessoa é feito na tela).
    const P = this.perfil;
    if (this.modo === "demo") {
      const f = () => cb(isEsc() ? demoLer() : demoLer().filter(p => p.loja === P.loja));
      this._listeners.add(f); f();
      return () => this._listeners.delete(f);
    }
    const { db, F } = this._fb, col = F.collection(db, "chamados");
    const q = isEsc() ? F.query(col, F.orderBy("criadoEm", "desc"), F.limit(500)) : F.query(col, F.where("loja", "==", P.loja));
    return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => { console.error(err); toast("Erro ao sincronizar: " + err.code, "erro"); });
  },

  async listarEquipe() {
    if (this.modo === "demo") return DEMO_USERS.filter(u => ["escritorio", "gestor"].includes(u.perfil));
    const { db, F } = this._fb;
    const s = await F.getDocs(F.query(F.collection(db, "usuarios"), F.where("perfil", "in", ["escritorio", "gestor"])));
    return s.docs.map(d => ({ uid: d.id, ...d.data() }));
  },
  _avisar() { this._listeners.forEach(f => f()); },

  async criarPedido(p) {
    const hist = { em: Date.now(), por: quemSou(), acao: "Chamado aberto" };
    if (this.modo === "demo") {
      const l = demoLer();
      const n = l.reduce((m, x) => Math.max(m, x.numero || 0), 0) + 1;
      const novo = { ...p, id: "L" + Date.now(), numero: n, historico: [hist] };
      l.push(novo); demoSalvar(l); this._avisar(); return novo;
    }
    const { db, F } = this._fb;
    const ref = F.doc(F.collection(db, "chamados")), cont = F.doc(db, "config", "contador");
    let n;
    await F.runTransaction(db, async t => {
      const s = await t.get(cont);
      n = (s.exists() ? s.data().n : 0) + 1;
      t.set(cont, { n });
      t.set(ref, { ...p, numero: n, historico: [hist] });
    });
    return { id: ref.id, numero: n };
  },

  async atualizar(id, patch, acao, obs) {
    const h = { em: Date.now(), por: quemSou(), acao }; if (obs) h.obs = obs;
    patch = { ...patch, atualizadoEm: Date.now() };
    if (this.modo === "demo") {
      const l = demoLer(), p = l.find(x => x.id === id); if (!p) return;
      Object.assign(p, patch); p.historico = [...(p.historico || []), h];
      demoSalvar(l); this._avisar(); return;
    }
    const { db, F } = this._fb;
    await F.updateDoc(F.doc(db, "chamados", id), { ...patch, historico: F.arrayUnion(h) });
  }
};

  const falha = (msg, foco) => { toast(msg, "erro"); foco?.focus(); };
  const prioridade = t.imediato ? "urgente" : (g("prioridade") || "normal");
  if (prioridade === "urgente" && !t.imediato && !g("obs")) return falha("Chamado urgente: explique o motivo na observação.", form.obs);
  if (novoTipo === "cadastro" && !novoFotos.length) return falha("Envie pelo menos uma foto do rótulo.", $("#fotosInput"));
  const ambiguo = form.querySelector("input[data-ambig]"); if (ambiguo) return falha("Tem código com mais de um produto possível. Toque no produto certo.", ambiguo);
  const lerItens = () => [...form.querySelectorAll("#itens .item")].map(el => {
    const o = {}; el.querySelectorAll("input,select").forEach(i => { if (!i.name || i.disabled) return; o[i.name] = i.type === "checkbox" ? i.checked : i.value.trim(); });
    const prod = Produtos.buscar(o.codigo);
    if (prod) { o.descricao = o.descricao || prod.descricao; o.plu = prod.codigo; o.ean = prod.ean || ""; }
    return o;
  });
  let dados;
  if (novoTipo === "placa") dados = { itens: lerItens() };
  if (novoTipo === "caixa") dados = { itens: lerItens() };
  if (novoTipo === "ajuste") {
    const its = lerItens();
    for (const [n, i] of its.entries()) {
      if (isNaN(numero(i.sistema)) || isNaN(numero(i.fisico))) return falha(`Produto ${n + 1}: informe as duas quantidades em número.`);
      if (difAjuste(i) === 0) return falha(`Produto ${n + 1}: sistema e físico estão iguais, não há o que ajustar.`);
    }
    dados = { itens: its };
  }
  if (novoTipo === "balanca") {
    const bals = [...form.querySelectorAll("input[name=balanca]:checked")].map(i => i.value);
    if (!bals.length) return falha("Marque qual balança vai receber a carga.", form.querySelector("input[name=balanca]"));
    dados = { balancas: bals, itens: lerItens() };
  }
  if (novoTipo === "cadastro") dados = { ean: g("ean"), descricao: g("descricao"), fornecedor: g("fornecedor") };
  if (novoTipo === "nfe") dados = { destinatario: g("destinatario"), itens: lerItens() };
  if (novoTipo === "devolucao") dados = { tipoDevolucao: g("tipoDevolucao"), fornecedor: g("fornecedor"), nfOrigem: g("nfOrigem"), itens: lerItens() };
  const solNome = g("solNome").replace(/\s+/g, " "), solCargo = g("solCargo");
  if (solNome.length < 3) return falha("Informe seu nome no bloco Solicitante.", form.solNome);
  if (solCargo === "Gerente" && !podeSerGerente(solNome)) return falha(msgGerente(), form.solCargo);
  const eu = Pessoa.ler();
  if (!eu || eu.nome !== solNome || eu.cargo !== solCargo) Pessoa.salvar(solNome, solCargo);
  btn.disabled = true; btn.textContent = "Enviando…";
  const agora = Date.now();
  const p = { tipo: novoTipo, loja: P.loja, setor: g("setor"), prioridade, dados, obs: g("obs"), fotos: novoFotos.slice(),
    status: "aberto", solicitanteUid: P.uid, solicitanteNome: solNome, cargo: solCargo, dispositivoId: Pessoa.ler()?.id || "", contaLoja: P.nome,
    responsavelUid: null, responsavelNome: null,
    criadoEm: agora, atualizadoEm: agora };
  try {
    const r = await Store.criarPedido(p);
    toast(`Chamado ${num4(r.numero)} aberto`, "ok");
    novoTipo = null; novoFotos = []; aba = "meus"; resetFiltros(); render();
  } catch (e) {
    console.error(e); toast("Erro ao enviar: " + (e.code || e.message), "erro");
    btn.disabled = false; btn.textContent = "Abrir chamado";
  }
}

/* ---------- listas ---------- */
function filtrar() {
  const f = filtros; let l = PEDIDOS.slice();
  if (f.status === "ativos") l = l.filter(p => ATIVOS.includes(p.status));
  else if (f.status !== "todos") l = l.filter(p => p.status === f.status);
  if (f.tipo !== "todos") l = l.filter(p => p.tipo === f.tipo);
  if (f.loja !== "todas") l = l.filter(p => p.loja === f.loja);
  if (f.meus) l = l.filter(p => isEsc() ? p.responsavelUid === Store.perfil.uid : ehMeu(p));
  if (f.atrasados) l = l.filter(atrasado);
  const q = f.busca.toLowerCase().trim(); if (q) l = l.filter(p => textoBusca(p).includes(q));
  const ativo = p => ATIVOS.includes(p.status);
  return l.sort((a, b) => {
    if (ativo(a) !== ativo(b)) return ativo(a) ? -1 : 1;
    if (!ativo(a)) return (b.atualizadoEm || 0) - (a.atualizadoEm || 0);
    const ua = ehUrgente(a), ub = ehUrgente(b); if (ua !== ub) return ua ? -1 : 1;
    const aa = atrasado(a), ab = atrasado(b); if (aa !== ab) return aa ? -1 : 1;
    return a.criadoEm - b.criadoEm;
  });
}

function cardPedido(p) {
  const t = TIPOS[p.tipo] || { curto: p.tipo, cor: "#999" }, s = STATUS[p.status] || { nome: p.status, cor: "#999" };
  return `<button class="chamado" data-act="abrir" data-id="${esc(p.id)}" style="--c:${t.cor};--f:${s.cor}">
    <div class="chamado-l1"><span class="num">${num4(p.numero)}</span><span class="tag" style="--c:${t.cor}">${t.curto}</span>
      ${tagPrio(p)}${atrasado(p) && p.prioridade === "urgente" ? '<span class="tag atr">Atrasado</span>' : ""}
      <span class="status" style="--c:${s.cor}">${s.nome}</span></div>
    <div class="chamado-res">${esc(resumo(p))}</div>
    <div class="chamado-meta">${isEsc() ? esc(p.loja) + " · " : ""}${ehLoja() && ehMeu(p) ? "Você" : esc(p.solicitanteNome) + (isEsc() && p.cargo ? " (" + esc(p.cargo) + ")" : "")} · ${esc(p.setor)} · ${desde(p.criadoEm)}${p.status === "concluido" && (p.resolvidoPor || p.responsavelNome) ? " · Resolvido por " + esc(p.resolvidoPor || p.responsavelNome) : p.responsavelNome ? " · Resp.: " + esc(p.responsavelNome) : ""}</div>
  </button>`;
}

function listaHTML() {
  const l = filtrar();
  return l.length ? `<div class="lista">${l.map(cardPedido).join("")}</div>` : `<div class="vazio">Nenhum chamado aqui.</div>`;
}

function chipsStatus() {
  const lista = isEsc()
    ? [["todos", "Todos"], ["ativos", "Ativos"], ["aberto", "Pendentes"], ["andamento", "Em atendimento"], ["concluido", "Resolvidos"], ["cancelado", "Cancelados"]]
    : [["todos", "Todos"], ["ativos", "Em aberto"], ["concluido", "Resolvidos"], ["cancelado", "Cancelados"]];
  return lista.map(([v, n]) => `<button class="chip ${filtros.status === v && !filtros.atrasados ? "on" : ""}" data-act="chip" data-v="${v}">${n}</button>`).join("");
}

function farolHTML() {
  const n = st => PEDIDOS.filter(p => p.status === st).length;
  const b = (st, rot) => `<button class="${filtros.status === st && !filtros.atrasados ? "on" : ""}" data-act="chip" data-v="${filtros.status === st ? "todos" : st}" style="--c:${STATUS[st].cor}"><i></i><div><b>${n(st)}</b><span>${rot}</span></div></button>`;
  return `<div class="farol">${b("aberto", "Pendentes")}${b("andamento", "Em atendimento")}${b("concluido", "Concluídos")}</div>`;
}

function vMeus() {
  const ger = ehGerenteAqui();
  return `<div class="banner neutro">${ger ? "Aqui aparecem os chamados que <b>você</b> abriu e os <b>resolvidos da loja</b>. " : "Aqui aparecem os chamados que <b>você</b> abriu. "}<b>Resolvido</b> = o escritório já entregou na loja. Não chegou? Abra o chamado e toque em <b>Não recebi</b>.</div>
    ${farolHTML()}
    <div class="filtros">${chipsStatus()}</div>
    <div class="filtros">
      <input type="search" data-f="busca" placeholder="Buscar nº, código, produto, NF…" value="${esc(filtros.busca)}">
      ${ger ? `<label class="check"><input type="checkbox" data-f="meus" ${filtros.meus ? "checked" : ""}> Só os que eu abri</label>` : ""}
    </div>
    <div id="lista">${listaHTML()}</div>`;
}

function vFila() {
  const atr = PEDIDOS.filter(atrasado).length;
  const urg = PEDIDOS.filter(p => p.status === "aberto" && ehUrgente(p));
  const kpi = (k, n, cor, rot) => `<button class="kpi ${(k === "atr" ? filtros.atrasados : k === "meus" ? filtros.meus : (!filtros.atrasados && filtros.status === k)) ? "on" : ""}" data-act="kpi" data-v="${k}" style="--c:${cor}"><b>${n}</b><span>${rot}</span></button>`;
  return `${urg.length ? `<button class="alerta-urg" data-act="abrir" data-id="${esc(urg.sort((a, b) => a.criadoEm - b.criadoEm)[0].id)}">
      <b>${urg.length} chamado${urg.length > 1 ? "s" : ""} URGENTE${urg.length > 1 ? "S" : ""} sem responsável</b>
      <span>${urg.map(p => num4(p.numero) + " · " + esc(TIPOS[p.tipo]?.curto || "") + " · " + desde(p.criadoEm)).join("  |  ")} — toque para abrir</span></button>` : ""}
    ${farolHTML()}
    <div class="kpis">
      ${kpi("meus", PEDIDOS.filter(p => p.status === "andamento" && ehResponsavel(p)).length, "#111111", "Comigo — eu assumi")}
      ${kpi("atr", atr, "#D93025", "Viraram urgentes (fora do prazo)")}
    </div>
    <div class="filtros">${chipsStatus()}</div>
    <div class="filtros">
      <select data-f="tipo"><option value="todos">Todos os tipos</option>${Object.entries(TIPOS).map(([k, t]) => `<option value="${k}" ${filtros.tipo === k ? "selected" : ""}>${t.nome}</option>`).join("")}</select>
      ${LOJAS.length > 1 ? `<select data-f="loja"><option value="todas">Todas as lojas</option>${LOJAS.map(l => `<option ${filtros.loja === l ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : ""}
      <input type="search" data-f="busca" placeholder="Buscar nº, código, produto, NF, fornecedor…" value="${esc(filtros.busca)}">
      <label class="check"><input type="checkbox" data-f="meus" ${filtros.meus ? "checked" : ""}> Só os que eu assumi</label>
    </div>
    <div id="lista">${listaHTML()}</div>`;
}

function vPainel() {
  const ini = periodo === "hoje" ? new Date().setHours(0, 0, 0, 0) : Date.now() - (+periodo) * 86400000;
  const l = PEDIDOS.filter(p => p.criadoEm >= ini && p.status !== "cancelado");
  const resolvidos = a => a.filter(fimResolucao);
  const media = a => a.length ? a.reduce((s, p) => s + (fimResolucao(p) - p.criadoEm), 0) / a.length : null;
  const pct = a => a.length ? Math.round(a.filter(noPrazo).length / a.length * 100) : null;
  const agrupar = fn => {
    const g = {}; l.forEach(p => { const k = fn(p) || "—"; (g[k] = g[k] || []).push(p); });
    return Object.entries(g).map(([k, a]) => { const r = resolvidos(a); return { k, n: a.length, tm: media(r), pc: pct(r) }; }).sort((a, b) => b.n - a.n);
  };
  const tabela = (rows, rotulo, cor) => {
    if (!rows.length) return `<div class="vazio">Sem chamados no período.</div>`;
    const max = Math.max(1, ...rows.map(r => r.n));
    return `<div class="tab-wrap"><table><thead><tr><th>Pos.</th><th>${rotulo}</th><th>Chamados</th><th style="width:28%"></th><th>Tempo médio</th><th>No prazo</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td>${i + 1}º</td><td>${esc(r.label || r.k)}</td><td><b>${r.n}</b></td>
        <td><div class="bar"><span style="width:${r.n / max * 100}%;background:${cor(r)}"></span></div></td>
        <td>${fmtDur(r.tm)}</td><td>${r.pc == null ? "—" : r.pc + "%"}</td></tr>`).join("")}</tbody></table></div>`;
  };
  const res = resolvidos(l), pc = pct(res);
  const assumidos = l.filter(p => p.assumidoEm);
  const tAssumir = assumidos.length ? assumidos.reduce((s, p) => s + (p.assumidoEm - p.criadoEm), 0) / assumidos.length : null;
  const reab = l.filter(p => p.contestado).length, pReab = res.length || reab ? Math.round(reab / Math.max(1, res.length + reab) * 100) : null;
  const kpi = (n, rot, cor) => `<div class="kpi static" style="--c:${cor}"><b>${n}</b><span>${rot}</span></div>`;
  const porTipo = agrupar(p => p.tipo).map(r => ({ ...r, label: TIPOS[r.k]?.nome || r.k }));

  return `<div class="filtros">${[["hoje", "Hoje"], ["7", "7 dias"], ["30", "30 dias"], ["90", "90 dias"]].map(([v, n]) => `<button class="chip ${periodo === v ? "on" : ""}" data-act="periodo" data-v="${v}">${n}</button>`).join("")}</div>
    <div class="card"><h3>Sumário</h3><ol class="legenda" style="margin:0;padding-left:20px">
      <li>Visão geral</li><li>Chamados por tipo</li><li>Chamados por setor</li><li>Quem mais solicita</li><li>Quem resolve (escritório)</li><li>Como ler este painel</li></ol></div>
    <div class="card"><h3>1. Visão geral</h3><div class="kpis" style="margin:0">
      ${kpi(l.length, "Chamados no período", "#111111")}
      ${kpi(l.filter(p => p.status === "concluido").length, "Resolvidos e entregues", STATUS.concluido.cor)}
      ${kpi(l.filter(p => p.prioridade === "urgente").length, "Urgentes no período", "#D93025")}
      ${kpi(pReab == null ? "—" : pReab + "%", `Reabertos pela loja (${reab}) · meta < 5%`, pReab > 5 ? "#D93025" : "#D97706")}
      ${kpi(fmtDur(tAssumir), "Tempo médio até assumir", "#2563EB")}
      ${kpi(fmtDur(media(res)), "Tempo médio de resolução", "#3BB072")}
      ${kpi(pc == null ? "—" : pc + "%", "Resolvidos no prazo (meta 90%)", pc != null && pc < 90 ? "#D97706" : "#3BB072")}
      ${kpi(PEDIDOS.filter(p => ATIVOS.includes(p.status)).length, "Em aberto agora", STATUS.aberto.cor)}
      ${kpi(PEDIDOS.filter(atrasado).length, "Atrasados agora", "#D93025")}
    </div></div>
    <div class="card"><h3>2. Chamados por tipo</h3>${tabela(porTipo, "Tipo", r => TIPOS[r.k]?.cor || "#999")}</div>
    <div class="card"><h3>3. Chamados por setor</h3>${tabela(agrupar(p => p.setor), "Setor", () => "#3BB072")}</div>
    <div class="card"><h3>4. Quem mais solicita</h3>${tabela(agrupar(p => (p.solicitanteNome || "").trim().replace(/\s+/g, " ").replace(/(^|\s)\S/g, c => c.toUpperCase()) + (p.cargo ? " (" + p.cargo + ")" : "") + (LOJAS.length > 1 ? " · " + p.loja : "")), "Solicitante", () => "#111111")}</div>
    <div class="card"><h3>5. Quem resolve (escritório)</h3>${tabela(agrupar(p => p.responsavelNome || "Sem responsável"), "Responsável", () => "#2563EB")}</div>
    <div class="card"><h3>6. Como ler este painel</h3><div class="legenda">
      <p><b>Chamados no período:</b> chamados abertos pela loja dentro do período escolhido acima. Cancelados não entram na conta.</p>
      <p><b>Tempo médio até assumir:</b> quanto tempo o chamado fica esperando até alguém do escritório pegar. Mostra se a fila está sendo olhada.</p>
      <p><b>Tempo médio de resolução:</b> tempo entre a loja abrir o chamado e o escritório marcar como resolvido e entregue.</p>
      <p><b>Resolvidos no prazo (meta 90%):</b> % dos chamados resolvidos dentro do prazo: normal ${PRAZO_NORMAL_H}h, urgente e emissão de NF ${PRAZO_URGENTE_MIN} min, sempre até as ${LOJA_FECHA_H}h do mesmo dia (horário da loja: ${LOJA_ABRE_H}h às ${LOJA_FECHA_H}h). Abaixo de 90% aparece em laranja.</p>
      <p><b>Urgentes no período:</b> chamados que a loja marcou como urgentes. Muitos urgentes podem indicar falta de planejamento (ex.: placas pedidas só no dia da oferta).</p>
      <p><b>Reabertos pela loja:</b> % de chamados marcados como resolvidos que a loja disse não ter recebido. Referência de mercado: abaixo de 5%.</p>
      <p><b>Atrasados agora:</b> chamados pendentes ou em atendimento que já passaram do prazo. Chamado normal que passa do prazo (2h ou 21h) vira urgente automaticamente.</p>
      <p><b>Quem resolve (5):</b> chamados por pessoa do escritório, com o tempo médio e o % no prazo de cada uma. "Sem responsável" são chamados que ninguém assumiu.</p>
      <p><b>Rankings (2 a 5):</b> sempre do maior para o menor volume. Muitos chamados do mesmo setor ou da mesma pessoa podem indicar um problema que se repete na loja (ex.: muitos produtos sem cadastro na mesma seção).</p>
    </div></div>`;
}

/* ---------- detalhe do chamado ---------- */
function blocoDados(p) {
  const d = p.dados || {}, it = d.itens || [];
  const dl = arr => `<dl class="info">${arr.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v || "—")}</dd></div>`).join("")}</dl>`;
  const tabQtd = rot => `<div class="sec-tit">${rot} · ${it.length}</div><div class="tab-wrap"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th>Quantidade</th></tr></thead>
    <tbody>${it.map(i => `<tr><td>${esc(i.plu || i.codigo)}</td><td>${esc(i.descricao || "— não encontrado na base")}</td><td><b>${esc(i.qtd)}</b></td></tr>`).join("")}</tbody></table></div>`;
  if (p.tipo === "placa") return `<div class="sec-tit">Placas · ${it.length} produto(s) · ${totalPlacas(p)} placa(s)</div><div class="tab-wrap"><table>
      <thead><tr><th>Código</th><th>Descrição</th><th>Modelo</th><th>Tamanho</th><th>Qtd</th></tr></thead>
      <tbody>${it.map(i => `<tr><td>${esc(i.plu || i.codigo)}</td><td>${esc(i.descricao || "— não encontrado na base")}</td><td>${esc(i.modelo)}</td><td>${esc(i.tamanho)}</td><td><b>${esc(i.qtd)}</b></td></tr>`).join("")}</tbody></table></div>`;
  if (p.tipo === "caixa") { const n = totalPlacas(p); return `<div class="sec-tit">Carga para os caixas · ${it.length} produto(s)${n ? ` · ${n} placa(s)` : ""}</div><div class="tab-wrap"><table>
      <thead><tr><th>Código</th><th>Descrição</th><th>Motivo</th><th>Placa</th></tr></thead>
      <tbody>${it.map(i => `<tr><td>${esc(i.plu || i.codigo)}</td><td>${esc(i.descricao || "— não encontrado na base")}</td><td>${esc(i.motivo)}</td>
        <td>${i.placa ? `<b>Sim</b> · ${esc(i.modelo)} · ${esc(i.tamanho)} · ${esc(i.qtdPlaca)} un.` : "Não"}</td></tr>`).join("")}</tbody></table></div>`; }
  if (p.tipo === "ajuste") return `<div class="sec-tit">Ajuste de estoque · ${it.length} produto(s)</div><div class="tab-wrap"><table>
      <thead><tr><th>Código</th><th>Descrição</th><th>Sistema</th><th>Físico</th><th>Diferença</th><th>Motivo</th></tr></thead>
      <tbody>${it.map(i => { const d = difAjuste(i); return `<tr><td>${esc(i.plu || i.codigo)}</td><td>${esc(i.descricao || "— não encontrado na base")}</td>
        <td>${esc(i.sistema)}</td><td>${esc(i.fisico)}</td><td class="${d < 0 ? "dif-neg" : "dif-pos"}"><b>${d > 0 ? "+" : ""}${fmtQtd(d)}</b></td><td>${esc(i.motivo)}</td></tr>`; }).join("")}</tbody></table></div>
      <p class="dica">Diferença = físico − sistema. Negativo: falta produto na loja (o sistema tem mais). Positivo: sobra (o sistema tem menos).</p>`;
  if (p.tipo === "balanca") return `<div class="sec-tit">Carga para balança</div>${dl([["Balança(s)", (d.balancas || []).map(b => "Nº " + b).join(", ")]])}
      <div class="sec-tit">Produtos que não estão entrando · ${it.length}</div><div class="tab-wrap"><table>
      <thead><tr><th>Código</th><th>Descrição</th><th>Problema</th></tr></thead>
      <tbody>${it.map(i => `<tr><td>${esc(i.plu || i.codigo)}</td><td>${esc(i.descricao || "— não encontrado na base")}</td><td>${esc(i.problema)}</td></tr>`).join("")}</tbody></table></div>`;
  if (p.tipo === "cadastro") return `<div class="sec-tit">Produto para cadastrar</div>${dl([["Código de barras", d.ean], ["Descrição do rótulo", d.descricao], ["Marca / fornecedor", d.fornecedor]])}`;
  if (p.tipo === "nfe") return `<div class="sec-tit">Nota fiscal a emitir</div>${dl([["Destinatário", d.destinatario]])}${tabQtd("Itens da nota")}`;
  if (p.tipo === "devolucao") return `<div class="sec-tit">Devolução ao fornecedor</div>${dl([["Tipo de devolução", d.tipoDevolucao], ["Fornecedor", d.fornecedor], ["NF de origem", d.nfOrigem]])}${tabQtd("Produtos a devolver")}`;
  return it.length ? tabQtd("Itens") : "";
}

function acoesHTML(p) {
  const b = (acao, rot, cls = "") => `<button class="${cls === "sec" ? "btn-sec" : "btn" + (cls === "perigo" ? " perigo" : "")}" data-act="acao" data-acao="${acao}">${rot}</button>`;
  const L = []; let dica = "";
  const dono = ehResponsavel(p), G = isGestor(), ativo = ATIVOS.includes(p.status);
  if (isEsc()) {
    if (p.status === "aberto") { L.push(b("assumir", "Assumir chamado")); dica = "Quem assumir fica responsável por resolver e entregar."; }
    if (p.status === "andamento" && (dono || G)) {
      L.push(b("resolver", "Resolvido e entregue"));
      L.push(b("cancelar", "Cancelar", "sec"));
      dica = (dono ? "" : `Assumido por ${esc(p.responsavelNome)}. Como gestor, você pode agir no lugar. `) + "Só marque “Resolvido e entregue” depois que o material estiver na loja (ou o ajuste feito no sistema).";
    }
    if (p.status === "andamento" && !dono && !G) dica = `Assumido por <b>${esc(p.responsavelNome)}</b>. Só quem assumiu resolve; para trocar o responsável, fale com o gestor.`;
    if ((p.status === "concluido" || p.status === "cancelado") && (dono || G)) L.push(b("reabrir", "Reabrir", "sec"));
    if (G && ativo) L.push(b("transferir", p.responsavelUid ? "Transferir responsável" : "Atribuir a alguém", "sec"));
  } else if (ehMeu(p)) {
    if (p.status === "aberto") L.push(b("cancelar", "Cancelar chamado", "sec"));
    if (p.status === "concluido") { L.push(b("contestar", "Não recebi / não resolveu", "sec")); dica = "O escritório marcou como resolvido e entregue. Se não chegou ou ficou errado, use o botão acima."; }
    if (p.status === "andamento") dica = `${esc(p.responsavelNome || "O escritório")} já está cuidando deste chamado.`;
  } else {
    dica = `Chamado aberto por ${esc(p.solicitanteNome)}. Você está vendo porque é gerente da loja.`;
  }
  if (!L.length && !dica) return "";
  return `<div class="sec-tit">Ações</div>${dica ? `<p class="dica">${dica}</p>` : ""}${L.length ? `<div class="barra-fixa acoes-fixas"><div class="acoes">${L.join("")}</div></div>` : ""}`;
}

function vDetalhe(p) {
  const t = TIPOS[p.tipo] || { nome: p.tipo, cor: "#999" }, s = STATUS[p.status] || { nome: p.status, cor: "#999" }, E = isEsc();
  const info = [["Loja", p.loja], ["Setor", p.setor], ["Solicitante", p.solicitanteNome + (p.cargo ? " · " + p.cargo : "")], ["Aberto em", fmtData(p.criadoEm)],
    ["Prioridade", TIPOS[p.tipo]?.imediato ? "Imediata" : p.prioridade === "urgente" ? "Urgente" : virouUrgente(p) ? "Virou urgente (passou do prazo)" : "Normal"], ["Prazo", fmtData(prazoMs(p)) + (atrasado(p) ? " (vencido)" : "")], ["Responsável", p.responsavelNome || "—"]];
  if (p.status === "concluido" && (p.resolvidoPor || p.responsavelNome)) info.push(["Resolvido por", p.resolvidoPor || p.responsavelNome]);
  if (p.concluidoEm) info.push(["Resolvido em", fmtData(p.concluidoEm)]);
  if (p.entreguePara) info.push(["Entregue para", p.entreguePara]);
  return `<div class="md-head" style="--c:${t.cor}"><span class="num">${num4(p.numero)}</span><b>${t.nome}</b><button class="x-close" data-act="fechar" aria-label="Fechar">×</button></div>
  <div class="md-body">
    <div class="chamado-l1"><span class="status" style="--c:${s.cor};margin-left:0">${s.nome}</span>
      ${tagPrio(p)}${atrasado(p) && p.prioridade === "urgente" ? '<span class="tag atr">Atrasado</span>' : ""}</div>
    <dl class="info">${info.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    ${blocoDados(p)}
    ${p.obs ? `<div class="sec-tit">Observação</div><p style="margin:0 0 8px;white-space:pre-wrap">${esc(p.obs)}</p>` : ""}
    ${p.fotos?.length ? `<div class="sec-tit">Fotos</div><div class="fotos">${p.fotos.map((f, i) => `<button class="foto" data-act="verFoto" data-i="${i}"><img src="${esc(f)}" alt="Foto ${i + 1}"></button>`).join("")}</div>` : ""}
    ${acoesHTML(p)}
    <div class="sec-tit">Mensagens e histórico</div>
    ${podeMexer(p) ? `<div class="msg-box"><textarea id="msgTxt" rows="2" placeholder="${E ? "Mensagem para a loja…" : "Mensagem para o escritório…"}"></textarea><button class="btn" data-act="msg">Enviar</button></div>` : ""}
    <ul class="timeline">${(p.historico || []).slice().reverse().map(h => `<li><b>${esc(h.acao)}</b> <small>· ${esc(h.por)} · ${fmtData(h.em)}</small>${h.obs ? `<span class="obs">${esc(h.obs)}</span>` : ""}</li>`).join("")}</ul>
  </div>`;
}

function abrirDetalhe(id) { aberto = id; renderDetalhe(); $("#modal").hidden = false; document.body.style.overflow = "hidden"; }
function renderDetalhe() {
  const p = PEDIDOS.find(x => x.id === aberto); if (!p) { fecharDetalhe(); return; }
  const prev = $("#msgTxt")?.value || "", box = $("#modal"), sc = box.scrollTop;
  $("#modalBox").innerHTML = vDetalhe(p);
  if (prev) $("#msgTxt").value = prev;
  box.scrollTop = sc;
}
function fecharDetalhe() { aberto = null; $("#modal").hidden = true; $("#modalBox").innerHTML = ""; document.body.style.overflow = ""; }

/* ---------- diálogos (sem confirm()/prompt(), que travam no celular) ---------- */
function dialogo({ titulo, texto, placeholder, obrigatorio, botao = "Confirmar", perigo, opcoes }) {
  return new Promise(res => {
    const d = $("#dlg"); d.onclick = null;
    d.innerHTML = `<div class="dlg-box"><h3>${esc(titulo)}</h3><p>${esc(texto || "")}</p>
      ${opcoes ? `<select id="dlgSel"><option value="">Selecione</option>${opcoes.map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join("")}</select>` : ""}
      ${placeholder !== undefined ? `<textarea id="dlgTxt" rows="3" placeholder="${esc(placeholder)}" ${opcoes ? 'style="margin-top:8px"' : ""}></textarea>` : ""}
      <div class="dlg-err" id="dlgErr"></div>
      <div class="dlg-acts"><button class="btn-sec" id="dlgNo">Voltar</button><button class="btn ${perigo ? "perigo" : ""}" id="dlgOk">${esc(botao)}</button></div></div>`;
    d.hidden = false;
    const ta = $("#dlgTxt"); if (ta) setTimeout(() => ta.focus(), 50);
    const fim = v => { d.hidden = true; d.innerHTML = ""; res(v); };
    $("#dlgNo").onclick = () => fim(null);
    $("#dlgOk").onclick = () => {
      const v = ta ? ta.value.trim() : "", sel = $("#dlgSel")?.value;
      if (opcoes && !sel) { $("#dlgErr").textContent = "Escolha uma opção."; return; }
      if (obrigatorio && !v) { $("#dlgErr").textContent = "Preencha este campo."; return; }
      fim(opcoes ? { sel, txt: v } : v);
    };
  });
}
function verFoto(src) {
  const d = $("#dlg");
  d.innerHTML = `<div class="dlg-box dlg-foto"><button class="btn-sec" id="dlgFechar">Fechar</button><img src="${esc(src)}" alt="Foto do chamado"></div>`;
  d.hidden = false;
  d.onclick = ev => { if (ev.target === d || ev.target.id === "dlgFechar") { d.hidden = true; d.innerHTML = ""; d.onclick = null; } };
}

/* ---------- ações sobre o chamado ---------- */
async function executar(acao, p) {
  const P = Store.perfil, G = isGestor(), dono = ehResponsavel(p);
  const negar = msg => { toast(msg, "erro"); };
  try {
    let o;
    switch (acao) {
      case "assumir":
        if (p.responsavelUid && !dono) return negar(`Já assumido por ${p.responsavelNome}.`);
        await Store.atualizar(p.id, { status: "andamento", responsavelUid: P.uid, responsavelNome: P.nome, assumidoEm: Date.now() }, "Assumiu o chamado"); break;
      case "resolver":
        if (!dono && !G) return negar("Só quem assumiu o chamado pode resolver.");
        o = await dialogo({ titulo: "Resolvido e entregue", texto: `Chamado ${num4(p.numero)} será registrado como resolvido por ${P.nome}. Para quem foi entregue na loja? (Se foi só ajuste no sistema, escreva "sistema".)`, placeholder: "Ex.: entregue ao encarregado da mercearia", obrigatorio: true, botao: "Confirmar" });
        if (o === null) return;
        await Store.atualizar(p.id, { status: "concluido", concluidoEm: Date.now(), entreguePara: o, resolvidoPor: P.nome }, "Resolvido e entregue", o); break;
      case "contestar":
        o = await dialogo({ titulo: "Não recebi / não resolveu", texto: `O chamado volta para ${p.responsavelNome || "o escritório"}. Conte o que aconteceu.`, placeholder: "Ex.: placas não chegaram na loja", obrigatorio: true, botao: "Reabrir chamado", perigo: true });
        if (o === null) return;
        await Store.atualizar(p.id, { status: p.responsavelUid ? "andamento" : "aberto", concluidoEm: null, entreguePara: null, contestado: true }, "Loja reabriu: não recebeu / não resolveu", o); break;
      case "cancelar":
        if (isEsc() && !dono && !G) return negar("Só quem assumiu o chamado pode cancelar.");
        o = await dialogo({ titulo: "Cancelar chamado", texto: "Informe o motivo do cancelamento.", placeholder: "Motivo", obrigatorio: true, botao: "Cancelar chamado", perigo: true });
        if (o === null) return;
        await Store.atualizar(p.id, { status: "cancelado", canceladoEm: Date.now() }, "Chamado cancelado", o); break;
      case "reabrir":
        if (!dono && !G) return negar("Só quem assumiu (ou o gestor) pode reabrir.");
        o = await dialogo({ titulo: "Reabrir chamado", texto: `Por que o chamado está sendo reaberto? Ele volta para ${p.responsavelNome || "a fila"}.`, placeholder: "Motivo", obrigatorio: true, botao: "Reabrir" });
        if (o === null) return;
        await Store.atualizar(p.id, { status: p.responsavelUid ? "andamento" : "aberto", concluidoEm: null, canceladoEm: null, entreguePara: null }, "Chamado reaberto", o); break;
      case "transferir": {
        if (!G) return negar("Só o gestor transfere chamados.");
        const equipe = (await Store.listarEquipe()).filter(u => u.uid !== p.responsavelUid);
        if (!equipe.length) return negar("Nenhuma outra pessoa do escritório cadastrada.");
        o = await dialogo({ titulo: "Transferir responsável", texto: `Chamado ${num4(p.numero)}${p.responsavelNome ? ", hoje com " + p.responsavelNome : ""}. Para quem passa?`, opcoes: equipe.map(u => [u.uid, u.nome]), placeholder: "Motivo (opcional)", botao: "Transferir" });
        if (o === null) return;
        const u = equipe.find(x => x.uid === o.sel);
        await Store.atualizar(p.id, { status: "andamento", responsavelUid: u.uid, responsavelNome: u.nome, assumidoEm: p.assumidoEm || Date.now() }, `Transferido para ${u.nome}`, o.txt);
        break;
      }
      default: return;
    }
    toast("Chamado atualizado", "ok");
  } catch (e) {
    console.error(e);
    toast(e.code === "permission-denied" ? "Sem permissão: outra pessoa já assumiu este chamado." : "Não foi possível atualizar: " + (e.code || e.message), "erro");
  }
}

async function enviarMsg() {
  const ta = $("#msgTxt"), txt = ta?.value.trim(); if (!txt || !aberto) return;
  const p = PEDIDOS.find(x => x.id === aberto); if (p && !podeMexer(p)) return toast("Só quem assumiu o chamado conversa com a loja.", "erro");
  try { ta.value = ""; await Store.atualizar(aberto, {}, isEsc() ? "Mensagem do escritório" : "Mensagem da loja", txt); }
  catch (e) { ta.value = txt; toast("Mensagem não enviada: " + (e.code || e.message), "erro"); }
}

/* ---------- sessão ---------- */
function onPedidos(lista) {
  if (isEsc() && !primeiraCarga) {
    const novos = lista.filter(p => !conhecidos.has(p.id) && p.status === "aberto");
    if (novos.length) {
      beep(); if (novos.some(p => p.prioridade === "urgente")) setTimeout(beep, 250);
      toast((novos.some(p => p.prioridade === "urgente") ? "URGENTE · " : "") + (novos.length === 1 ? `Novo chamado ${num4(novos[0].numero)} · ${TIPOS[novos[0].tipo]?.nome || ""} · ${novos[0].loja}` : `${novos.length} novos chamados na fila`), novos.some(p => p.prioridade === "urgente") ? "erro" : "ok");
    }
  }
  conhecidos = new Set(lista.map(p => p.id)); primeiraCarga = false;
  TODOS = lista; PEDIDOS = isEsc() ? lista : lista.filter(visivelLoja);
  if (ehLoja() && !Pessoa.ler()) { montarTopo(); return; }
  refrescar();
  if (aberto) renderDetalhe();
}

function iniciarSessao() {
  if (!Store.perfil) { renderLogin(); return; }
  aba = isEsc() ? "fila" : "novo"; novoTipo = null; novoFotos = []; resetFiltros();
  primeiraCarga = true; conhecidos = new Set();
  if (unsub) unsub();
  unsub = Store.observarPedidos(onPedidos);
  if (ehLoja() && !Pessoa.ler()) { renderIdentificacao(); return; }
  render();
}

async function sair() {
  if (unsub) { unsub(); unsub = null; }
  PEDIDOS = []; TODOS = []; fecharDetalhe();
  await Store.sair();
  if (Store.modo === "demo") renderLogin();
}

function esconderSplash() {
  const s = $("#splash"); if (!s || s.dataset.saiu) return; s.dataset.saiu = "1";
  setTimeout(() => { s.classList.add("sai"); setTimeout(() => s.remove(), 450); }, Math.max(0, 800 - (Date.now() - T0)));
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "modal") { fecharDetalhe(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const a = el.dataset.act;
  switch (a) {
    case "demo": Store.entrarDemo(el.dataset.uid); iniciarSessao(); break;
    case "sair":
      if (ehLoja() && Store.modo !== "demo") {
        dialogo({ titulo: "Sair da conta da loja?", texto: "Para entrar de novo neste celular vai ser preciso o e-mail e a senha da loja. Se só quer trocar a pessoa, use “Não é você? Trocar” na tela de novo chamado.", botao: "Sair mesmo assim", perigo: true })
          .then(o => { if (o !== null) sair(); });
      } else sair();
      break;
    case "trocarPessoa":
      dialogo({ titulo: "Trocar pessoa", texto: "Os chamados de quem estava usando continuam salvos. A próxima pessoa informa o nome dela.", botao: "Trocar" })
        .then(o => { if (o === null) return; Pessoa.limpar(); fecharDetalhe(); PEDIDOS = []; renderIdentificacao(); });
      break;
    case "aba": aba = el.dataset.aba; resetFiltros(); render(); window.scrollTo(0, 0); break;
    case "escolherTipo": novoTipo = el.dataset.tipo; novoFotos = []; render(); window.scrollTo({ top: 0, behavior: "smooth" }); setTimeout(() => $("#fNovo [name=solNome]")?.value ? $("#fNovo [name=setor]")?.focus({ preventScroll: true }) : $("#fNovo [name=solNome]")?.focus({ preventScroll: true }), 300); break;
    case "voltarTipo": novoTipo = null; novoFotos = []; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "addItem": { $("#itens").insertAdjacentHTML("beforeend", itemHTML(novoTipo)); const novo = $("#itens").lastElementChild; novo.scrollIntoView({ behavior: "smooth", block: "center" }); novo.querySelector("input[data-f=cod]")?.focus({ preventScroll: true }); break; }
    case "rmItem":
      if (document.querySelectorAll("#itens .item").length > 1) el.closest(".item").remove();
      else toast("O chamado precisa de pelo menos um produto."); break;
    case "escolherProd": { const inp = el.closest(".item").querySelector("input[data-f=cod]"); inp.value = el.dataset.cod; infoCodigo(inp); break; }
    case "scan": escanear(el.closest(".cod-in").querySelector("input")); break;
    case "rmFoto": novoFotos.splice(+el.dataset.i, 1); renderFotos(); break;
    case "chip": filtros.status = el.dataset.v; filtros.atrasados = false; render(); $("#lista")?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "kpi":
      if (el.dataset.v === "meus") { filtros.meus = !filtros.meus; }
      else if (el.dataset.v === "atr") { filtros.atrasados = !filtros.atrasados; filtros.status = "ativos"; }
      else { filtros.status = el.dataset.v; filtros.atrasados = false; }
      render(); break;
    case "periodo": periodo = el.dataset.v; render(); break;
    case "imprimir": window.print(); break;
    case "abrir": abrirDetalhe(el.dataset.id); break;
    case "fechar": fecharDetalhe(); break;
    case "verFoto": { const p = PEDIDOS.find(x => x.id === aberto); if (p) verFoto(p.fotos[+el.dataset.i]); break; }
    case "msg": enviarMsg(); break;
    case "acao": { const p = PEDIDOS.find(x => x.id === (el.dataset.id || aberto)); if (p) executar(el.dataset.acao, p); break; }
  }
});
document.addEventListener("change", e => {
  const f = e.target.dataset?.f;
  if (f === "tipo" || f === "loja") { filtros[f] = e.target.value; render(); }
  else if (f === "fazPlaca") {
    const item = e.target.closest(".item"), on = e.target.checked, box = item.querySelector(".placa-extra");
    box.hidden = !on; box.querySelectorAll("select,input").forEach(i => { i.disabled = !on; i.required = on; });
    if (on) { const mot = item.querySelector("[name=motivo]").value, mod = item.querySelector("[name=modelo]");
      if (!mod.value) mod.value = mot === "Preço de clube" ? "Clube Fidelidade" : mot === "Produto vai entrar em promoção" ? "Oferta" : ""; }
  }
  else if (f === "motivoCarga") {
    const item = e.target.closest(".item"), chk = item.querySelector("[name=placa]");
    if (MOTIVOS_PLACA.includes(e.target.value) && !chk.checked) { chk.checked = true; chk.dispatchEvent(new Event("change", { bubbles: true })); }
  }
  else if (f === "todasBal") { document.querySelectorAll("input[name=balanca]").forEach(i => i.checked = e.target.checked); }
  else if (e.target.name === "balanca" && !e.target.checked) { const t = document.querySelector("[data-f=todasBal]"); if (t) t.checked = false; }
  else if (f === "prioridade") { const u = e.target.value === "urgente"; $("#urgAviso").hidden = !u; $("#obsRot").textContent = u ? "Motivo da urgência (obrigatório)" : "Observação (opcional)"; }
  else if (f === "meus") { filtros.meus = e.target.checked; render(); }
  else if (e.target.id === "fotosInput") { addFotos([...e.target.files]); e.target.value = ""; }
});
document.addEventListener("input", e => {
  if (e.target.dataset?.f === "cod") { infoCodigo(e.target); return; }
  if (e.target.dataset?.f === "qtdAjuste") {
    const item = e.target.closest(".item"), s = numero(item.querySelector("[name=sistema]").value), fi = numero(item.querySelector("[name=fisico]").value), box = item.querySelector(".dif");
    if (isNaN(s) || isNaN(fi)) { box.innerHTML = ""; return; }
    const d = fi - s;
    box.innerHTML = d === 0 ? '<span class="ci-warn">Sistema e físico iguais: não há o que ajustar.</span>'
      : `<span class="${d < 0 ? "dif-neg" : "dif-pos"}">Diferença: <b>${d > 0 ? "+" : ""}${fmtQtd(d)}</b> · ${d < 0 ? "falta na loja (sistema tem mais)" : "sobra na loja (sistema tem menos)"}</span>`;
    return;
  }
  if (e.target.dataset?.f === "busca") { filtros.busca = e.target.value; const l = $("#lista"); if (l) l.innerHTML = listaHTML(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "fNovo") { e.preventDefault(); enviarNovo(e.target); }
  if (e.target.id === "fLogin") { e.preventDefault(); login(e.target); }
  if (e.target.id === "fPessoa") { e.preventDefault(); salvarIdentificacao(e.target); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#dlg").hidden && aberto) fecharDetalhe(); });
window.addEventListener("storage", e => { if (e.key === "cs_demo_chamados_v4" && Store.modo === "demo") Store._avisar(); });
// Escritório: apita a cada 45s enquanto houver URGENTE sem responsável
setInterval(() => { if (isEsc() && PEDIDOS.some(p => p.status === "aberto" && ehUrgente(p))) { beep(); setTimeout(beep, 250); } if ((aba === "fila" || aba === "meus") && $("#modal").hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")) render(); }, 45000);
// Atualiza "há X min" e atrasos a cada minuto
setInterval(() => { if (Store.perfil && !aberto && $("#dlg").hidden) refrescar(); }, 60000);

/* ---------- início ---------- */
(async () => {
  try { await Store.iniciar(); }
  catch (e) { console.error(e); Store.modo = "demo"; toast("Não foi possível conectar ao Firebase. Abrindo em modo demonstração.", "erro"); }
  if (Store.modo === "demo") demoSemear();
  await Produtos.carregar();
  Store.aoMudarSessao(perfil => { esconderSplash(); perfil ? iniciarSessao() : renderLogin(); });
})();
</script>
</body>
