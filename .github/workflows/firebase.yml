# Publica no Firebase as regras do banco (firestore.rules) e a função de avisos (functions/)
# sempre que um desses arquivos mudar. Precisa do segredo FIREBASE_SERVICE_ACCOUNT no GitHub
# (Settings › Secrets and variables › Actions). Sem o segredo, não faz nada.
name: Publicar no Firebase
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "functions/**", "firebase.json", ".github/workflows/firebase.yml"]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Credencial
        if: env.SA != ''
        run: echo "$SA" > "$RUNNER_TEMP/sa.json" && echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Regras do banco
        if: env.SA != ''
        run: npx -y firebase-tools@13 deploy --only firestore:rules --project superville-chamados --non-interactive
      - name: Função de avisos (precisa do plano Blaze)
        if: env.SA != ''
        run: |
          cd functions && npm install --omit=dev && cd ..
          npx -y firebase-tools@13 deploy --only functions --project superville-chamados --non-interactive --force
